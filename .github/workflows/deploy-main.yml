name: Deploy main to Bluehost production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PWA to production site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp PWA version
        run: python pwa-website/tools/stamp_version.py

      - name: Deploy pwa-website to Bluehost production folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./pwa-website/
          server-dir: ${{ secrets.BLUEHOST_PROD_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/serve.py
            **/tools/**
            **/visualize.html
            **/visualize.css

      - name: Smoke test production PWA
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://fortressofmuslim.org/ > /dev/null
