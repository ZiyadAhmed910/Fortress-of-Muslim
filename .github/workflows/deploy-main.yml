name: Deploy main to Bluehost production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PWA to production site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp PWA version
        run: python pwa-website/tools/stamp_version.py

      # The PWA is served from Cloudflare (pwa-website/wrangler.jsonc, edge/worker.js). The Bluehost
      # upload below continues as a warm standby, so pointing DNS back at Bluehost is an instant
      # rollback with the same build -- see docs/deployment.md.
      - name: Set up Node.js
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        run: npm ci

      - name: Build the published site
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        run: node pwa-website/tools/build-dist.mjs

      - name: Deploy PWA to Cloudflare production
        id: cloudflare
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        working-directory: pwa-website
        run: |
          npx wrangler deploy --config wrangler.ci.jsonc --env production | tee "$RUNNER_TEMP/wrangler.txt"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.txt" | head -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the Cloudflare deployment
        if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && steps.cloudflare.outputs.url != '' }}
        env:
          SITE: ${{ steps.cloudflare.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$SITE/" | grep -q 'js/app.js?v=build-'
          curl --fail --silent --show-error "$SITE/hisn/chapter1" | grep -q 'js/app.js?v=build-'
          curl --fail --silent --show-error "$SITE/sw.js" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$SITE/no-such-page")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$SITE/package.json")" = 404

      - name: Deploy pwa-website to Bluehost production folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./pwa-website/
          server-dir: ${{ secrets.BLUEHOST_PROD_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/serve.py
            **/tools/**
            **/visualize.html
            **/visualize.css
            **/node_modules/**
            **/package.json
            **/package-lock.json
            **/vitest.config.js
            **/test/**
            **/edge/**
            **/dist/**
            **/wrangler.jsonc
            **/wrangler.ci.jsonc

      - name: Smoke test production PWA
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://fortressofmuslim.org/ > /dev/null
