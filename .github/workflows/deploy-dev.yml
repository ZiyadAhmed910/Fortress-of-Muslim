name: Deploy dev to Bluehost test

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PWA to test site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp PWA version
        run: python pwa-website/tools/stamp_version.py

      - name: Deploy pwa-website to Bluehost test folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./pwa-website/
          server-dir: ${{ secrets.BLUEHOST_TEST_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/serve.py
            **/tools/**
            **/visualize.html
            **/visualize.css
            **/node_modules/**
            **/package.json
            **/package-lock.json
            **/vitest.config.js
            **/test/**

      - name: Smoke test test PWA
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://test.fortressofmuslim.org/ > /dev/null
