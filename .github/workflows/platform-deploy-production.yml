name: Deploy Fortress Platform API to production

on:
  push:
    branches:
      - main
    paths:
      - "apps/auth/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/contracts/**"
      - "tools/deployment-smoke.mjs"
      - "pwa-website/data/duas.json"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "tsconfig.base.json"
      - ".github/workflows/platform-deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: platform-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production API Worker
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify platform
        run: npm run check

      - name: Apply D1 identity migrations
        run: npm run db:migrate:production --workspace @fortress/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply additive D1 content migrations
        run: npm run db:migrate:production --workspace @fortress/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Auth to Cloudflare production
        run: npm run deploy:production:ci --workspace @fortress/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Cloudflare production
        run: npm run deploy:production --workspace @fortress/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply API Cron Triggers
        run: npx wrangler triggers deploy --env production --cwd apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy MCP to Cloudflare production
        run: npm run deploy:production:ci --workspace @fortress/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployed services
        run: npm run smoke:production:services
