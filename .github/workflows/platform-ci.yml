name: Fortress Platform CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "pwa-website/**"
      - "packages/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/platform-*.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/**"
      - "pwa-website/**"
      - "packages/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/platform-*.yml"

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check platform
        run: npm run check
