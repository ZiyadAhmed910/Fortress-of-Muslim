<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="presentation">
  <defs>
    <linearGradient id="skymorning" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0.00" stop-color="#0f3b6b"/>
      <stop offset="0.50" stop-color="#3d86b4"/>
      <stop offset="1.00" stop-color="#f0bf74"/>
    </linearGradient>
    <radialGradient id="glowmorning" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#ffe6ae" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffe6ae" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe6ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigmorning" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <!-- One ornament shared by all nine: an eight-point star on a wide repeat, faint enough to read
         as texture rather than pattern. The first version tiled at 64px and came out a diamond mesh. -->
    <pattern id="latmorning" width="112" height="112" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#fff6e2" stroke-opacity="0.1" stroke-width="1.2">
        <polygon points="56,10 67,34 91,23 80,47 104,56 80,65 91,89 67,78 56,102 45,78 21,89 32,65 8,56 32,47 21,23 45,34"/>
      </g>
    </pattern>
  </defs>

  <rect width="660" height="400" fill="url(#skymorning)"/>
  <rect width="660" height="400" fill="url(#latmorning)"/>
  <rect width="660" height="400" fill="url(#glowmorning)"/>
