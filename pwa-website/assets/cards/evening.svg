<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="presentation">
  <defs>
    <linearGradient id="skyevening" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0.00" stop-color="#1d1b46"/>
      <stop offset="0.50" stop-color="#6d2f63"/>
      <stop offset="1.00" stop-color="#e0754c"/>
    </linearGradient>
    <radialGradient id="glowevening" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#ffb469" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffb469" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffb469" stop-opacity="0"/>
