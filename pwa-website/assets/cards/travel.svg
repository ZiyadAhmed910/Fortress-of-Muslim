<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="presentation">
  <defs>
    <linearGradient id="skytravel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0.00" stop-color="#0a2038"/>
      <stop offset="0.50" stop-color="#1b5075"/>
      <stop offset="1.00" stop-color="#2e91b0"/>
    </linearGradient>
    <radialGradient id="glowtravel" cx="0.78" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#b8ecff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#b8ecff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b8ecff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigtravel" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </radialGradient>
    <!-- One ornament shared by all nine: an eight-point star on a wide repeat, faint enough to read
         as texture rather than pattern. The first version tiled at 64px and came out a diamond mesh. -->
    <pattern id="lattravel" width="112" height="112" patternUnits="userSpaceOnUse">
